name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Import smoke check
        run: |
          uv run python -c "
          import ast
          ast.parse(open('main.py').read())
          from core.profile_manager import ProfileManager
          from core.utils import get_db_settings
          from core.database import DatabaseManager
          from core.updater import UpdateManager
          from email_processing.connector import EmailConnector
          from email_processing.handlers import OrderEmailHandler, XboxEmailHandler, CostcoEmailHandler
          from config.settings import SEARCH_CRITERIA, CURRENT_VERSION
          from output.file_handlers import OutputHandler
          from continuous_monitor import ContinuousMonitor
          from api.submitter import APIConfig, OrderAPISubmitter
          print('all imports OK')
          "

      # TODO(Phase 4): add `ruff check` and `ruff format --check` here
      # TODO(Phase 5): add `ty check` here
