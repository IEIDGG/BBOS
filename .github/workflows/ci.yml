name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Import smoke check
        run: |
          uv run python -c "
          import ast
          ast.parse(open('main.py').read())
          from core.profile_manager import ProfileManager
          from core.utils import get_db_settings
          from core.database import DatabaseManager
          from core.updater import UpdateManager
          from email_processing.connector import EmailConnector
          from email_processing.handlers import OrderEmailHandler, XboxEmailHandler, CostcoEmailHandler
          from config.settings import SEARCH_CRITERIA, CURRENT_VERSION
          from output.file_handlers import OutputHandler
          from continuous_monitor import ContinuousMonitor
          from api.submitter import APIConfig, OrderAPISubmitter
          print('all imports OK')
          "

      - name: Ruff lint
        run: uvx --from ruff==0.16.2 ruff check .

      - name: Ruff format check
        run: uvx --from ruff==0.16.2 ruff format --check .

      - name: ty type check
        run: uvx --from ty==0.0.70 ty check --output-format github .

      - name: Bump script tests
        run: uv run python tests/test_bump_scraper_version.py

      - name: Whitespace check tests
        run: uv run python tests/test_check_ws.py

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript syntax and scrape helpers
        run: |
          node tests/test_scrape_core.js
          node tests/test_package_integrity.js

      - name: Trailing whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check_ws.sh "$BASE_SHA"

      - name: Unpacked extension smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.49.0
          npx --prefix "$RUNNER_TEMP/pw" playwright install chromium --with-deps
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" xvfb-run -a node tests/test_extension_smoke.js

  install-bat-windows:
    # End-to-end test of the actual end-user install flow. main.py itself
    # is an interactive console app that expects real credentials, so it
    # is intentionally not launched here — only install.bat is exercised.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run install.bat
        shell: cmd
        run: install.bat < NUL

      - name: Verify uv and virtual environment
        shell: cmd
        run: |
          where uv >nul 2>nul
          if errorlevel 1 (
            "%USERPROFILE%\.local\bin\uv.exe" --version
          ) else (
            uv --version
          )
          if not exist .venv (
            echo .venv was not created by install.bat
            exit /b 1
          )
          echo install.bat verification OK
