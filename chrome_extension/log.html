<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IEID Scraper Log</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid #333;
      background: #16213e;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 span {
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .status-text { font-size: 13px; color: #aaa; flex: 1; }
    .running-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: #333;
      color: #888;
    }
    .running-badge.active { background: #1f3d2a; color: #56d364; }
    .progress-bar {
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 3px;
      transition: width 0.3s;
      width: 0%;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat {
      background: #0d1117;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
    }
    .stat-num { font-size: 20px; font-weight: 700; color: #667eea; }
    .stat-label { font-size: 10px; color: #888; margin-top: 4px; text-transform: uppercase; }
    main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 12px 20px 20px;
    }
    .log-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: #888;
    }
    .log {
      flex: 1;
      overflow-y: auto;
      background: #0d1117;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    .log-entry { color: #8b949e; margin-bottom: 2px; }
    .log-entry.success { color: #56d364; }
    .log-entry.error { color: #f85149; }
    .log-entry.info { color: #79c0ff; }
  </style>
</head>
<body>
  <header>
    <h1><span>IEID</span> Scraper Live Log</h1>
    <div class="status-row">
      <div class="status-text" id="statusText">Waiting for scrape...</div>
      <div class="running-badge" id="runningBadge">Idle</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="statOrders">0</div><div class="stat-label">Orders</div></div>
      <div class="stat"><div class="stat-num" id="statShipments">0</div><div class="stat-label">Shipments</div></div>
      <div class="stat"><div class="stat-num" id="statTracking">0</div><div class="stat-label">Tracked</div></div>
      <div class="stat"><div class="stat-num" id="statSent">0</div><div class="stat-label">Sent</div></div>
      <div class="stat"><div class="stat-num" id="statCancelled">0</div><div class="stat-label">Cancelled</div></div>
      <div class="stat"><div class="stat-num" id="statSkipped">0</div><div class="stat-label">Skipped</div></div>
    </div>
  </header>
  <main>
    <div class="log-toolbar">
      <span id="logCount">0 entries</span>
      <span id="scrollHint">Auto-scroll on</span>
    </div>
    <div class="log" id="log"></div>
  </main>
  <script src="log.js"></script>
</body>
</html>
